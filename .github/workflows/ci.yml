name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

      - name: Smoke-test the pipeline (generate -> train -> snapshot -> score)
        run: |
          python -m lotiq.data.generate -n 500
          python -m lotiq.models.train
          python -m lotiq.data.snapshot -n 20
          python -m lotiq.cli data/synthetic/warehouse_snapshot.csv -o /tmp/scored.csv
